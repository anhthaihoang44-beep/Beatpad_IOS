name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build with Xcode
        run: |
          xcodebuild build \
            -project BeatPad.xcodeproj \
            -scheme BeatPad \
            -destination "generic/platform=iOS" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Compile BeatPad iOS Executable with swiftc (Standalone Packaging)
        run: |
          mkdir -p build/BeatPad.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK at: $SDK_PATH"
          swiftc -v -target arm64-apple-ios16.0 -sdk "$SDK_PATH" \
            -framework SwiftUI \
            -framework UIKit \
            -framework AVFoundation \
            -framework Foundation \
            -framework Combine \
            BeatPad/App/BeatPadApp.swift \
            BeatPad/Core/AudioEngine.swift \
            BeatPad/Presentation/MainTabView.swift \
            BeatPad/Presentation/LaunchpadView.swift \
            BeatPad/Presentation/SequencerView.swift \
            -o build/BeatPad.app/BeatPad \
            -emit-executable
          ls -lh build/BeatPad.app/BeatPad

      - name: Package Real IPA
        run: |
          mkdir -p Payload/BeatPad.app
          cp build/BeatPad.app/BeatPad Payload/BeatPad.app/
          cp BeatPad/Info.plist Payload/BeatPad.app/Info.plist
          echo "APPL????" > Payload/BeatPad.app/PkgInfo
          if [ -d "BeatPad/samples" ]; then
            cp -R BeatPad/samples Payload/BeatPad.app/
          fi
          if [ -d "BeatPad/en.lproj" ]; then
            cp -R BeatPad/en.lproj Payload/BeatPad.app/
          fi
          if [ -d "BeatPad/vi.lproj" ]; then
            cp -R BeatPad/vi.lproj Payload/BeatPad.app/
          fi
          zip -r BeatPad_iOS.ipa Payload
          ls -lh BeatPad_iOS.ipa

      - name: Upload BeatPad iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatPad_iOS_Release
          path: BeatPad_iOS.ipa
          retention-days: 14
